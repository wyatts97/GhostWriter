<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GhostWriter{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
    <script>
      // Blocking — runs before first paint to prevent dark-mode flash
      (function() {
        var t = localStorage.getItem('ghostwriter-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>
</head>
<body>

    <!-- Navigation -->
    <nav class="nav-bar">
        <div class="nav-brand">GhostWriter</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}"
               class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
               Dashboard
            </a>
            <a href="/prompts"
               class="nav-link {% if active_page == 'prompts' %}active{% endif %}">
               Prompts
            </a>
            <a href="/feeds"
               class="nav-link {% if active_page == 'feeds' %}active{% endif %}">
               Feeds
            </a>
            <a href="/schedules"
               class="nav-link {% if active_page == 'schedules' %}active{% endif %}">
               Schedules
            </a>
            <a href="/articles"
               class="nav-link {% if active_page == 'articles' %}active{% endif %}">
               Articles
            </a>
        </div>
        <div class="nav-right">
            <div class="nav-status">
                <span class="nav-status-dot"></span>
                <span>Online</span>
            </div>
            <!-- Theme Toggle -->
            <button class="btn-icon" id="theme-toggle" title="Toggle dark/light mode" onclick="toggleTheme()">
                <svg id="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <circle cx="12" cy="12" r="5"></circle>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                </svg>
                <svg id="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <!-- Nav separator -->
            <span class="nav-separator"></span>
            <!-- Settings -->
            <a href="/settings" class="btn-icon btn-icon-settings" title="Settings">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>
            </a>
        </div>
    </nav>

    <!-- Flash Messages -->
    <div class="flash-messages" id="flash-messages">
        {% if saved %}
        <div class="flash-message success">Settings saved successfully.</div>
        {% endif %}
    </div>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        // ── Auto-dismiss flash messages ──
        document.addEventListener('DOMContentLoaded', function() {
            const flashes = document.querySelectorAll('.flash-message');
            flashes.forEach(function(msg) {
                setTimeout(function() {
                    msg.style.opacity = '0';
                    msg.style.transition = 'opacity 0.3s ease';
                    setTimeout(function() { msg.remove(); }, 300);
                }, 4000);
            });

            // ── Sync icon with the theme set in <head> ──
            const saved = localStorage.getItem('ghostwriter-theme');
            if (saved === 'dark') {
                document.getElementById('theme-icon-sun').style.display = '';
                document.getElementById('theme-icon-moon').style.display = 'none';
            }
        });

        // ── Theme toggle ──
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            if (isDark) {
                html.removeAttribute('data-theme');
                localStorage.setItem('ghostwriter-theme', 'light');
                document.getElementById('theme-icon-sun').style.display = 'none';
                document.getElementById('theme-icon-moon').style.display = '';
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('ghostwriter-theme', 'dark');
                document.getElementById('theme-icon-sun').style.display = '';
                document.getElementById('theme-icon-moon').style.display = 'none';
            }
        }
    </script>

    <script>
    // ── Auto-loading state on form submit ──
    document.addEventListener('submit', function(e) {
      const form = e.target;
      const btns = form.querySelectorAll('button[type="submit"]');
      btns.forEach(function(btn) {
        btn.disabled = true;
        btn.classList.add('btn-loading');
        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        spinner.setAttribute('aria-hidden', 'true');
        btn.insertBefore(spinner, btn.firstChild);
      });
    });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
